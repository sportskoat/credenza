[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Canonical host: www → apex
[[redirects]]
  from = "https://www.credenzafashion.com/*"
  to = "https://credenzafashion.com/:splat"
  status = 301
  force = true

# Shared hauls (LB-8). The page is server-rendered so a crawler that does not
# run JavaScript still gets an Open Graph card. status = 200 rewrites the path
# without a redirect, so the visitor's address bar keeps /s/<code>.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/share-page"
  status = 200

# Discovery files
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/BingSiteAuth.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Baseline security + quality headers (all routes)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
