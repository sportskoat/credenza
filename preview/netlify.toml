[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Canonical host: www → apex
[[redirects]]
  from = "https://www.credenzafashion.com/*"
  to = "https://credenzafashion.com/:splat"
  status = 301
  force = true

# The card picture for a shared haul (LB-39). MUST stay above the /s/* rule
# below: Netlify takes the first rule that matches, and /s/* would swallow
# /s/<code>/img and answer it with HTML. The :code placeholder arrives as a
# query parameter, which is why share-image reads the query before the path.
[[redirects]]
  from = "/s/:code/img"
  to = "/.netlify/functions/share-image?code=:code"
  status = 200

# Shared hauls (LB-8). The page is server-rendered so a crawler that does not
# run JavaScript still gets an Open Graph card. status = 200 rewrites the path
# without a redirect, so the visitor's address bar keeps /s/<code>.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/share-page"
  status = 200

# Settings deep links (CH-12). /settings and /settings/<section> are app
# entrances, not files on disk — serve the app and let the boot effect open
# the right sheet. Only this prefix falls back: a genuinely wrong URL
# anywhere else must still 404.
[[redirects]]
  from = "/settings/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

# Discovery files
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/BingSiteAuth.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/google624a8f93f4906c6d.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/og.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

# Caching. Netlify's default is max-age=0,must-revalidate on every file, so the
# live site was re-sending a 352 KB font and 884 KB of content-hashed JavaScript
# to every returning visitor. A content hash in the filename makes `immutable`
# safe: different bytes mean a different URL, so a cached copy cannot go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not content-hashed, so a day rather than a year.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# sw.js is the one file that must NEVER be cached. It decides which build a
# returning visitor runs. A stale worker keeps serving its old precache
# manifest, so a deploy never reaches anybody.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security + quality headers (all routes)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
