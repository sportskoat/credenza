<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Credenza Fashion · Agent haul planner</title>
    <meta
      name="description"
      content="Stash Weidian, Taobao and Yupoo finds on one shelf. Size from the chart and your measurements, keep the QC photos on the item, then open Buy in your agent."
    />
    <link rel="canonical" href="https://credenzafashion.com/" />
    <!-- The app opens in Blackout, so this is #000000 and not the #f4f4f0 the
         static pages use. It is only the value the browser paints before React
         mounts; it has to match the first frame.

         Deliberately ONE tag, not the media-scoped pair the /public/ pages
         carry. credenza-fashion.jsx:4584 rewrites this live with a single
         querySelector when the reader switches colourway. A pair would leave
         the second tag stale and the browser would honour whichever matched. -->
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Credenza Fashion · Agent haul planner" />
    <meta
      property="og:description"
      content="One shelf for the whole haul. Stash the links, size from the chart, judge the QC photos, then open Buy in your agent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://credenzafashion.com/" />
    <meta property="og:site_name" content="Credenza Fashion" />
    <meta property="og:image" content="https://credenzafashion.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Credenza Fashion — the agent haul planner" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Credenza Fashion · Agent haul planner" />
    <meta
      name="twitter:description"
      content="One shelf for the whole haul. Stash the links, size from the chart, judge the QC photos, then open Buy in your agent."
    />
    <meta name="twitter:image" content="https://credenzafashion.com/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Credenza Fashion",
        "url": "https://credenzafashion.com/",
        "applicationCategory": "ShoppingApplication",
        "operatingSystem": "Any",
        "description": "An agent haul planner. Stash Weidian, Taobao and Yupoo links on one shelf, size from the chart and your measurements, keep the QC photos on the item, and open Buy in your own shopping agent.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free to use. Pro raises the daily limits."
        },
        "publisher": { "@type": "Organization", "name": "Credenza Fashion" }
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="preload" href="/fonts/ClashGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Credenza Fashion" />
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
