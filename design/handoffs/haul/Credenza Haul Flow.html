-height:1.45;color:var(--cz-faint);text-wrap:pretty\">You send it. Credenza only writes it — your agent has to receive the request from you.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ qc.isGreen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px;padding:0 18px 18px\">\n            <div style=\"padding:11px;border-radius:12px;background:var(--cz-money-bg);font-size:12.5px;line-height:1.5;color:var(--cz-ink);text-wrap:pretty\">Green-lit. It moves to <em style=\"font-style:normal;font-weight:650\">QC done<\u002Fem> and can go in parcel A.<\u002Fdiv>\n            <div style=\"display:grid\"><x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Button\" hint-size=\"100%,40px\" variant=\"outline\" on-click=\"{{ qc.onParcel }}\">Add to parcel A<\u002Fx-import><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:9px;padding:14px 18px;border-top:1px solid var(--cz-hair)\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"font-family:var(--cz-mono);font-size:11px;font-weight:700;color:var(--cz-money)\">{{ qc.greenCount }}<\u002Fspan>\n            <span style=\"font-family:var(--cz-mono);font-size:11px;font-weight:700;color:var(--cz-error-text)\">{{ qc.redCount }}<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Button\" hint-size=\"auto,40px\" variant=\"outline\" on-click=\"{{ qc.onNextItem }}\">{{ qc.nextLabel }}<\u002Fx-import>\n          <\u002Fdiv>\n          <span style=\"font-size:11.5px;line-height:1.45;color:var(--cz-faint);text-wrap:pretty\">{{ qc.sellerNote }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"status\" style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;background:var(--cz-action-fill);color:var(--cz-action-text);font-size:13px;font-weight:650;box-shadow:0 14px 40px rgba(0,0,0,.5)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStorageClock&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;},&quot;packagingGrams&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;min&quot;:0,&quot;max&quot;:400,&quot;step&quot;:10,&quot;unit&quot;:&quot;g&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Parcel&quot;}}\">\nconst TILE = {\n  taobao: \"linear-gradient(150deg,#ff5000,#c33a00)\",\n  weidian: \"linear-gradient(150deg,#ff5a3c,#c8341f)\",\n  yupoo: \"linear-gradient(150deg,#37b24d,#1f7a33)\",\n  grey: \"linear-gradient(150deg,#2c2c31,#17171a)\"\n};\nconst REASONS = [\n  [\"stitching\", \"the stitching is coming apart\", \"走线开裂\"],\n  [\"print off\", \"the print is off-centre\", \"印花偏位\"],\n  [\"wrong size\", \"the size sent is not the size ordered\", \"尺码发错\"],\n  [\"stain\", \"there is a stain on the fabric\", \"有污渍\"],\n  [\"wrong colour\", \"the colour does not match the listing\", \"颜色不符\"],\n  [\"damaged\", \"the item arrived damaged\", \"有破损\"]\n];\nconst STAGES = [\n  [\"toOrder\", \"Not ordered\"],\n  [\"ordered\", \"Ordered\"],\n  [\"warehouse\", \"At the warehouse\"],\n  [\"qcd\", \"QC done\"],\n  [\"parcel\", \"In parcel A\"]\n];\nconst RAIL = [[\"toOrder\", \"To order\"], [\"ordered\", \"Ordered\"], [\"warehouse\", \"Warehouse\"], [\"qcd\", \"QC done\"], [\"parcel\", \"Parcel\"]];\nconst SEG_BG = { toOrder: \"var(--cz-hair)\", ordered: \"var(--cz-faint)\", warehouse: \"var(--cz-sub)\", qcd: \"var(--cz-ink)\", parcel: \"var(--cz-money)\" };\nconst MILESTONES = [\n  [\"submitted\", \"Submitted to the agent\"],\n  [\"shipped\", \"Shipped\"],\n  [\"customs\", \"Cleared customs\"],\n  [\"received\", \"Received\"]\n];\nconst SEED = [\n  { id: 1, title: \"ABC1996 Letter Print Vintage Washed Shirt\", size: \"Large\", price: 27.75, platform: \"Taobao\", tile: TILE.taobao, est: 220, actual: 268, vol: 2400, stage: \"qcd\", qc: \"green\", reason: null, photos: 9, storage: 62, order: \"SB-8827101\", when: \"Jul 30\" },\n  { id: 2, title: \"Wide-leg washed cargo pants\", size: \"XL\", price: 41.20, platform: \"Weidian\", tile: TILE.weidian, est: 400, actual: 512, vol: 3600, stage: \"warehouse\", qc: null, reason: null, photos: 12, storage: 58, order: \"SB-8827102\", when: \"Jul 28\" },\n  { id: 3, title: \"Nylon shell hooded jacket\", size: \"Large\", price: 63.00, platform: \"Yupoo\", tile: TILE.yupoo, est: 600, actual: 640, vol: 4200, stage: \"qcd\", qc: \"red\", reason: \"stitching\", photos: 11, storage: 57, order: \"SB-8827103\", when: \"Jul 30\" },\n  { id: 4, title: \"Suede chelsea boots\", size: \"43\", price: 88.00, platform: \"Taobao\", tile: TILE.taobao, est: 1100, actual: null, vol: 9000, stage: \"ordered\", qc: null, reason: null, photos: 0, storage: null, order: \"SB-8827104\", when: \"4 d ago\" },\n  { id: 5, title: \"Ribbed knit scarf\", size: \"One size\", price: 14.40, platform: \"Weidian\", tile: TILE.weidian, est: 180, actual: null, vol: 1800, stage: \"ordered\", qc: null, reason: null, photos: 0, storage: null, order: \"SB-8827105\", when: \"2 d ago\" },\n  { id: 6, title: \"Heavyweight tee · 2-pack\", size: \"Large\", price: 22.00, platform: \"Taobao\", tile: TILE.taobao, est: 480, actual: 505, vol: 3600, stage: \"warehouse\", qc: null, reason: null, photos: 7, storage: 60, order: \"SB-8827106\", when: \"Jul 26\" },\n  { id: 7, title: \"Goose down puffer jacket\", size: \"Large\", price: 112.00, platform: \"Weidian\", tile: TILE.weidian, est: 900, actual: null, vol: 8000, stage: \"toOrder\", qc: null, reason: null, photos: 0, storage: null, order: \"\", when: \"\" },\n  { id: 8, title: \"Wool ribbed beanie\", size: \"One size\", price: 14.00, platform: \"Yupoo\", tile: TILE.yupoo, est: 90, actual: null, vol: 1200, stage: \"toOrder\", qc: null, reason: null, photos: 0, storage: null, order: \"\", when: \"\" },\n  { id: 9, title: \"Selvedge washed denim\", size: \"32\", price: 39.65, platform: \"Taobao\", tile: TILE.taobao, est: 700, actual: 726, vol: 4200, stage: \"parcel\", qc: \"green\", reason: null, photos: 8, storage: 55, order: \"SB-8827107\", when: \"Jul 29\" }\n];\nconst OTHER_HAULS = [\n  { name: \"gym\", items: 3, goods: 118.20, tiles: [TILE.weidian, TILE.taobao, TILE.weidian, TILE.grey], counts: { warehouse: 3 }, shortNote: \"Storage ends in 6 d\", tone: \"urgent\", headline: \"Free storage ends in 6 days on all three items.\", sub: \"After that Superbuy bills daily. Everything has arrived — this haul is one parcel away from done.\", cta: \"Build the parcel\" },\n  { name: \"casuals\", items: 4, goods: 128.60, tiles: [TILE.yupoo, TILE.taobao, TILE.weidian, TILE.yupoo], counts: { parcel: 4 }, shortNote: \"Delivered · $164.20 landed\", tone: \"done\" },\n  { name: \"summer\", items: 2, goods: 57.80, tiles: [TILE.taobao, TILE.weidian, TILE.grey, TILE.grey], counts: { toOrder: 2 }, shortNote: \"Nothing ordered yet\", tone: \"idle\" }\n];\nconst TONE = {\n  urgent: { ink: \"var(--cz-error-text)\", dot: \"var(--cz-error-text)\", border: \"var(--cz-error-text)\" },\n  attention: { ink: \"var(--cz-ink)\", dot: \"var(--cz-warn, #f59e0b)\", border: \"var(--cz-hair-strong)\" },\n  done: { ink: \"var(--cz-sub)\", dot: \"var(--cz-money)\", border: \"var(--cz-hair)\" },\n  idle: { ink: \"var(--cz-sub)\", dot: \"var(--cz-faint)\", border: \"var(--cz-hair)\" }\n};\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"index\",\n    items: SEED.map(i => ({ ...i })),\n    detailId: null,\n    qcId: null,\n    photo: 0,\n    divisor: 6000,\n    line: \"EMS\",\n    rates: { EMS: 13.10, \"GD-EUB\": 15.40, DHL: 22.30 },\n    declared: 40,\n    milestone: 0,\n    submitted: false,\n    tracking: \"\",\n    fit: {},\n    toast: null\n  };\n\n  componentDidMount() {\n    this._key = e => {\n      if (!this.state.qcId) return;\n      const k = e.key.toLowerCase();\n      if (k === \"arrowright\") this.photoStep(1);\n      else if (k === \"arrowleft\") this.photoStep(-1);\n      else if (k === \"g\") this.decide(\"green\");\n      else if (k === \"r\") this.decide(\"red\");\n      else if (k === \"escape\") this.setState({ qcId: null });\n    };\n    window.addEventListener(\"keydown\", this._key);\n  }\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this._key); }\n\n  go(screen) { this.setState({ screen, detailId: null }); window.scrollTo(0, 0); }\n  say(msg) {\n    clearTimeout(this._t);\n    this.setState({ toast: msg });\n    this._t = setTimeout(() => this.setState({ toast: null }), 2200);\n  }\n  patch(id, fields) { this.setState(s => ({ items: s.items.map(i => (i.id === id ? { ...i, ...fields } : i)) })); }\n  photoStep(d) {\n    const it = this.state.items.find(i => i.id === this.state.qcId);\n    if (!it) return;\n    const n = it.photos || 1;\n    this.setState(s => ({ photo: (s.photo + d + n) % n }));\n  }\n  decide(verdict) {\n    const id = this.state.qcId;\n    if (!id) return;\n    const cur = this.state.items.find(i => i.id === id);\n    this.patch(id, { qc: verdict, stage: \"qcd\", reason: verdict === \"red\" ? (cur.reason || \"stitching\") : null });\n  }\n  copy(text, note) {\n    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}\n    this.say(note);\n  }\n  g(n) { return n >= 1000 ? (n / 1000).toFixed(2) + \" kg\" : Math.round(n) + \" g\"; }\n  m(n) { return \"$\" + n.toFixed(2); }\n\n  renderVals() {\n    const S = this.state;\n    const items = S.items;\n    const packaging = this.props.packagingGrams ?? 140;\n    const showClock = this.props.showStorageClock ?? true;\n\n    const inParcel = items.filter(i => i.stage === \"parcel\");\n    const actualG = inParcel.reduce((a, i) => a + (i.actual || i.est), 0) + (inParcel.length ? packaging : 0);\n    const volCm3 = Math.round(inParcel.reduce((a, i) => a + i.vol, 0) * 1.18);\n    const volG = (volCm3 / S.divisor) * 1000;\n    const chargeableG = Math.max(actualG, volG);\n    const billedKg = inParcel.length ? Math.max(0.5, Math.ceil((chargeableG / 1000) * 2) / 2) : 0;\n    const headroomG = billedKg * 1000 - chargeableG;\n    const costOf = n => Math.max(8, S.rates[n] * billedKg);\n    const costs = Object.keys(S.rates).map(costOf);\n    const shipRange = inParcel.length ? \"~$\" + Math.round(Math.min(...costs)) + \"–\" + Math.round(Math.max(...costs)) : \"—\";\n    const boxGoodsN = inParcel.reduce((a, i) => a + i.price, 0);\n    const chosenCostN = inParcel.length ? costOf(S.line) : 0;\n\n    const tips = [];\n    if (inParcel.length && volG > actualG * 1.12)\n      tips.push(\"You're paying for air — volumetric \" + this.g(volG) + \" against \" + this.g(actualG) + \" actual. Ask your agent to drop the shoe boxes and re-measure.\");\n    if (inParcel.length && headroomG > 120) {\n      const cand = items.filter(i => i.stage === \"qcd\" && i.qc === \"green\").map(i => i.actual || i.est).sort((a, b) => a - b)[0];\n      tips.push(\"Billed at \" + billedKg.toFixed(1) + \" kg — \" + Math.round(headroomG) + \" g of headroom.\" + (cand && cand <= headroomG ? \" Your lightest green-lit item (\" + Math.round(cand) + \" g) ships free.\" : \"\"));\n    }\n    if (!inParcel.length) tips.push(\"Two half-parcels almost always cost more than one full one. Fill the box before you ship it.\");\n\n    const oldest = items.filter(i => i.storage != null && i.stage !== \"parcel\").sort((a, b) => a.storage - b.storage)[0];\n    const storageLine = showClock && oldest\n      ? \"Free storage ends in \" + oldest.storage + \" days on your oldest item at the warehouse. Superbuy holds 90 days — the clock starts on arrival, not on ship.\"\n      : \"Nothing is sitting at the warehouse on a clock.\";\n\n    const mk = it => {\n      const base = {\n        id: it.id, title: it.title, tile: it.tile, platform: it.platform,\n        short: it.title.length > 24 ? it.title.slice(0, 23) + \"…\" : it.title,\n        m2: this.m(it.price), toneColor: \"var(--cz-faint)\", actLabel: null,\n        onOpen: () => this.setState({ detailId: it.id })\n      };\n      if (it.stage === \"toOrder\") {\n        base.m1 = \"not ordered · est. \" + this.g(it.est);\n        base.actLabel = \"Copy link\";\n        base.onAct = e => { e.stopPropagation(); this.copy(\"https://weidian.com/item.html?itemID=\" + (7739000000 + it.id), \"Link copied\"); };\n      } else if (it.stage === \"ordered\") {\n        base.m1 = it.order + \" · \" + it.when;\n        base.actLabel = \"Mark arrived\";\n        base.onAct = e => { e.stopPropagation(); this.patch(it.id, { stage: \"warehouse\", actual: Math.round(it.est * 1.16), storage: 90, photos: 8 }); this.say(\"At the warehouse\"); };\n      } else if (it.stage === \"warehouse\") {\n        base.m1 = this.g(it.actual || it.est) + \" actual\" + (showClock && it.storage != null ? \" · \" + it.storage + \" d left\" : \"\");\n        base.actLabel = \"Review QC · \" + it.photos;\n        base.onAct = e => { e.stopPropagation(); this.setState({ qcId: it.id, photo: 0, detailId: null }); };\n      } else if (it.stage === \"qcd\") {\n        const green = it.qc === \"green\";\n        base.m1 = green ? \"green · \" + this.g(it.actual || it.est) : \"red · \" + (it.reason || \"flagged\");\n        base.toneColor = green ? \"var(--cz-money)\" : \"var(--cz-error-text)\";\n        base.actLabel = green ? \"Add to parcel\" : \"Return message\";\n        base.onAct = green\n          ? (e => { e.stopPropagation(); this.patch(it.id, { stage: \"parcel\" }); this.say(\"In parcel A\"); })\n          : (e => { e.stopPropagation(); this.setState({ qcId: it.id, photo: 0 }); });\n      } else {\n        base.m1 = this.g(it.actual || it.est);\n        base.onAct = e => { e.stopPropagation(); this.patch(it.id, { stage: \"qcd\" }); };\n      }\n      return base;\n    };\n\n    const col = (key, label, footerLabel, onFooter) => {\n      const list = items.filter(i => i.stage === key);\n      return { key, label, count: list.length, items: list.map(mk), footerLabel: list.length ? footerLabel : null, onFooter };\n    };\n    const columns = [\n      col(\"toOrder\", \"To order\", \"Copy all links\", () => this.copy(items.filter(i => i.stage === \"toOrder\").map(i => \"https://weidian.com/item.html?itemID=\" + (7739000000 + i.id)).join(\"\\n\"), \"All links copied — paste into your agent's bulk add\")),\n      col(\"ordered\", \"Ordered\", null, null),\n      col(\"warehouse\", \"At warehouse\", \"Review all QC\", () => { const f = items.find(i => i.stage === \"warehouse\"); if (f) this.setState({ qcId: f.id, photo: 0 }); }),\n      col(\"qcd\", \"QC done\", null, null)\n    ];\n\n    const lineRows = Object.keys(S.rates).map(n => ({\n      name: n,\n      days: n === \"EMS\" ? \"7–14 d\" : n === \"DHL\" ? \"3–6 d\" : \"10–20 d\",\n      rate: S.rates[n].toFixed(2),\n      cost: inParcel.length ? this.m(costOf(n)) : \"—\",\n      border: S.line === n ? \"var(--cz-ink)\" : \"var(--cz-hair)\",\n      bg: S.line === n ? \"var(--cz-accent-bg)\" : \"transparent\",\n      onPick: () => this.setState({ line: n }),\n      onRate: e => { const v = parseFloat(e.target.value) || 0; this.setState(s => ({ rates: { ...s.rates, [n]: v } })); }\n    }));\n\n    // ── Index ────────────────────────────────────────────────\n    const pendingQC = items.filter(i => i.stage === \"warehouse\" && i.photos > 0).length;\n    const winterCounts = RAIL.reduce((a, r) => { a[r[0]] = items.filter(i => i.stage === r[0]).length; return a; }, {});\n    const winterTone = pendingQC ? \"attention\" : inParcel.length ? \"done\" : \"idle\";\n    const winterNote = pendingQC ? pendingQC + \" waiting on QC\"\n      : S.screen === \"tracking\" && S.milestone >= 3 ? \"Delivered · \" + this.m(boxGoodsN + 18.40 + chosenCostN) + \" landed\"\n      : inParcel.length ? \"Parcel A ready · \" + this.g(chargeableG) : \"Nothing ordered yet\";\n\n    const goodsAll = items.reduce((a, i) => a + i.price, 0);\n    const stop = e => { if (e && e.stopPropagation) e.stopPropagation(); };\n\n    const mkHaul = (h) => ({\n      name: h.name,\n      tiles: h.tiles,\n      countLine: h.itemCount + \" items · \" + this.m(h.goods),\n      note: h.note,\n      noteInk: TONE[h.tone].ink,\n      dot: TONE[h.tone].dot,\n      flag: h.flag,\n      flagBg: h.tone === \"urgent\" ? \"var(--cz-error-bg)\" : h.tone === \"done\" ? \"var(--cz-money-bg)\" : \"rgba(0,0,0,.62)\",\n      flagInk: h.tone === \"urgent\" ? \"var(--cz-error-text)\" : h.tone === \"done\" ? \"var(--cz-money)\" : \"#fff\",\n      cta: h.cta,\n      ctaVariant: h.ctaVariant,\n      rowBorder: h.tone === \"urgent\" ? \"var(--cz-error-text)\" : \"var(--cz-hair)\",\n      segs: RAIL.filter(r => (h.counts[r[0]] || 0) > 0).map(r => ({ flex: h.counts[r[0]], bg: SEG_BG[r[0]] })),\n      onOpen: h.onOpen,\n      onCta: h.onCta\n    });\n\n    let winterCta = \"Open\", winterVariant = \"outline\", winterFlag = null, winterTone2 = \"idle\";\n    let winterNote2 = \"Nothing ordered yet.\";\n    let winterAct = () => this.go(\"board\");\n    if (pendingQC) {\n      winterCta = \"Review QC · \" + pendingQC;\n      winterVariant = \"primary\";\n      winterFlag = pendingQC + \" at QC\";\n      winterTone2 = \"attention\";\n      winterNote2 = pendingQC === 1 ? \"1 item is waiting on your green light.\" : pendingQC + \" items are waiting on your green light.\";\n      winterAct = () => { const f = items.find(i => i.stage === \"warehouse\" && i.photos > 0); this.setState({ screen: \"board\", qcId: f ? f.id : null, photo: 0, detailId: null }); window.scrollTo(0, 0); };\n    } else if (S.submitted && S.milestone >= 3) {\n      winterCta = \"Open\";\n      winterFlag = \"Delivered\";\n      winterTone2 = \"done\";\n      winterNote2 = \"Delivered · \" + this.m(boxGoodsN + 18.40 + chosenCostN) + \" landed.\";\n    } else if (S.submitted) {\n      winterCta = \"Track parcel A\";\n      winterVariant = \"primary\";\n      winterFlag = \"In transit\";\n      winterTone2 = \"attention\";\n      winterNote2 = \"Parcel A is with \" + S.line + \" · \" + this.g(chargeableG) + \".\";\n      winterAct = () => this.go(\"tracking\");\n    } else if (inParcel.length) {\n      winterCta = \"Review & hand off\";\n      winterVariant = \"primary\";\n      winterFlag = this.g(chargeableG);\n      winterTone2 = \"attention\";\n      winterNote2 = \"Parcel A is ready · \" + shipRange + \" to ship.\";\n    } else if (winterCounts.warehouse) {\n      winterCta = \"Build the parcel\";\n      winterVariant = \"primary\";\n      winterTone2 = \"attention\";\n      winterNote2 = \"Everything's reviewed. Nothing in the box yet.\";\n    } else if (winterCounts.toOrder) {\n      winterCta = \"Start ordering\";\n      winterNote2 = winterCounts.toOrder + \" items still to order.\";\n    }\n\n    const notWired = () => this.say(\"Only winter is wired up in this walkthrough\");\n    const hauls = [\n      mkHaul({\n        name: \"winter\", itemCount: items.length, goods: goodsAll,\n        tiles: [TILE.taobao, TILE.weidian, TILE.yupoo, TILE.taobao], counts: winterCounts,\n        note: winterNote2, flag: winterFlag,\n        cta: winterCta, ctaVariant: winterVariant, tone: winterTone2,\n        onOpen: () => this.go(\"board\"),\n        onCta: e => { stop(e); winterAct(); }\n      }),\n      mkHaul({ name: \"gym\", itemCount: 3, goods: 118.20, tiles: OTHER_HAULS[0].tiles, counts: { warehouse: 3 }, note: \"Free storage ends in 6 days on all 3 items.\", flag: \"6 d left\", cta: \"Build the parcel\", ctaVariant: \"primary\", tone: \"urgent\", onOpen: notWired, onCta: e => { stop(e); notWired(); } }),\n      mkHaul({ name: \"casuals\", itemCount: 4, goods: 128.60, tiles: OTHER_HAULS[1].tiles, counts: { parcel: 4 }, note: \"Delivered Jul 12 · landed $164.20.\", flag: \"Delivered\", cta: \"Open\", ctaVariant: \"outline\", tone: \"done\", onOpen: notWired, onCta: e => { stop(e); notWired(); } }),\n      mkHaul({ name: \"summer\", itemCount: 2, goods: 57.80, tiles: OTHER_HAULS[2].tiles, counts: { toOrder: 2 }, note: \"Nothing ordered yet.\", flag: null, cta: \"Start ordering\", ctaVariant: \"outline\", tone: \"idle\", onOpen: notWired, onCta: e => { stop(e); notWired(); } })\n    ];\n\n    // ── Detail drawer ────────────────────────────────────────\n    const d = items.find(i => i.id === S.detailId);\n    let detail = null;\n    if (d) {\n      const idx = STAGES.findIndex(s => s[0] === d.stage);\n      detail = {\n        tile: d.tile, platform: d.platform, title: d.title,\n        sizeLine: d.size + \" · \" + d.platform.toUpperCase(),\n        priceLabel: this.m(d.price),\n        weight: String(d.actual || d.est),\n        orderNo: d.order,\n        weightNote: d.actual\n          ? \"Weighed at the warehouse. Your estimate was \" + this.g(d.est) + \" — \" + (d.actual > d.est ? \"+\" : \"\") + Math.round(d.actual - d.est) + \" g out.\"\n          : \"Your estimate. It gets overwritten the moment the agent weighs it.\",\n        storageNote: showClock && d.storage != null ? \"Free storage ends in \" + d.storage + \" days.\" : null,\n        qcReady: d.photos > 0,\n        qcLabel: d.qc ? \"Reopen QC · \" + d.photos + \" photos\" : \"Review QC · \" + d.photos + \" photos\",\n        canParcel: d.qc === \"green\" && d.stage !== \"parcel\",\n        onQC: () => this.setState({ qcId: d.id, photo: 0, detailId: null }),\n        onParcel: () => { this.patch(d.id, { stage: \"parcel\" }); this.say(\"In parcel A\"); },\n        onShelf: () => { this.patch(d.id, { stage: \"toOrder\", qc: null, actual: null, storage: null, photos: 0, order: \"\" }); this.setState({ detailId: null }); this.say(\"Back on the shelf\"); },\n        stages: STAGES.map((s, i) => {\n          const done = i < idx, here = i === idx;\n          return {\n            label: s[1], when: here ? (d.when || \"now\") : \"\",\n            done: done || here,\n            markBorder: done || here ? \"var(--cz-action-fill)\" : \"var(--cz-hair-strong)\",\n            markFill: done || here ? \"var(--cz-action-fill)\" : \"transparent\",\n            color: here ? \"var(--cz-ink)\" : done ? \"var(--cz-sub)\" : \"var(--cz-faint)\",\n            bg: here ? \"var(--cz-accent-bg)\" : \"transparent\",\n            onPick: () => this.patch(d.id, { stage: s[0] })\n          };\n        })\n      };\n    }\n\n    // ── QC overlay ───────────────────────────────────────────\n    const q = items.find(i => i.id === S.qcId);\n    let qc = null;\n    if (q) {\n      const n = q.photos || 1;\n      const reasonRow = REASONS.find(r => r[0] === q.reason) || REASONS[0];\n      const queue = items.filter(i => i.stage === \"warehouse\" && i.id !== q.id);\n      qc = {\n        tile: q.tile, platform: q.platform, title: q.title,\n        sizeLine: q.size + \" · \" + q.order,\n        counter: \"QC review · \" + items.filter(i => i.qc).length + \" of \" + items.filter(i => i.photos > 0).length + \" done\",\n        photoLabel: \"Photo \" + (S.photo + 1) + \" of \" + n + \" · uploaded from Superbuy\",\n        thumbs: Array.from({ length: n }, (_, i) => ({ border: i === S.photo ? \"var(--cz-ink)\" : \"transparent\", bg: q.tile, onPick: () => this.setState({ photo: i }) })),\n        onPrev: () => this.photoStep(-1),\n        onNext: () => this.photoStep(1),\n        onClose: () => this.setState({ qcId: null }),\n        onGreen: () => this.decide(\"green\"),\n        onRed: () => this.decide(\"red\"),\n        isRed: q.qc === \"red\",\n        isGreen: q.qc === \"green\",\n        greenBorder: q.qc === \"green\" ? \"var(--cz-money)\" : \"var(--cz-hair-strong)\",\n        greenBg: q.qc === \"green\" ? \"var(--cz-money-bg)\" : \"transparent\",\n        redBorder: q.qc === \"red\" ? \"var(--cz-error-text)\" : \"var(--cz-hair-strong)\",\n        redBg: q.qc === \"red\" ? \"var(--cz-error-bg)\" : \"transparent\",\n        reasons: REASONS.map(r => ({ label: r[0], active: q.reason === r[0], onPick: () => this.patch(q.id, { reason: r[0], qc: \"red\" }) })),\n        message: \"Hi — please return order \" + q.order + \" (\" + q.title + \", \" + q.size + \"). In QC photo \" + (S.photo + 1) + \", \" + reasonRow[1] + \". Please request a replacement or a refund.\\n\\n你好，订单 \" + q.order + \" 需要退货：\" + reasonRow[2] + \"（质检图第\" + (S.photo + 1) + \"张）。麻烦帮忙换货或退款，谢谢。\",\n        onCopy: () => this.copy(\"return request\", \"Copied — paste it to your agent\"),\n        onParcel: () => { this.patch(q.id, { stage: \"parcel\" }); this.setState({ qcId: null }); this.say(\"In parcel A\"); },\n        greenCount: items.filter(i => i.qc === \"green\").length + \" green\",\n        redCount: items.filter(i => i.qc === \"red\").length + \" red\",\n        nextLabel: queue.length ? \"Next item →\" : \"Done\",\n        onNextItem: () => queue.length ? this.setState({ qcId: queue[0].id, photo: 0 }) : this.setState({ qcId: null }),\n        sellerNote: \"This seller: \" + items.filter(i => i.qc === \"green\").length + \" green, \" + items.filter(i => i.qc === \"red\").length + \" red across your shelf.\"\n      };\n    }\n\n    // ── Hand-off + tracking ──────────────────────────────────\n    const handoffText = inParcel.length\n      ? (inParcel.length === 1 ? \"Please pack this item into one parcel:\\n\" : \"Please pack these \" + inParcel.length + \" items into one parcel:\\n\") +\n        inParcel.map(i => \"· \" + i.order + \" — \" + i.title + \" (\" + i.size + \")\").join(\"\\n\") +\n        \"\\n\\nLine: \" + S.line + \". Declared value: \" + this.m(S.declared) + \". Remove shoe boxes and extra packaging. Leave everything else in storage.\\n\\n\" +\n        \"请将以上 \" + inParcel.length + \" 件打包成一个包裹，走 \" + S.line + \"，申报价值 \" + this.m(S.declared) + \"。鞋盒和多余包装请去掉，其余商品继续存仓，谢谢。\"\n      : \"Add something to parcel A first.\";\n\n    const remaining = items.filter(i => i.stage !== \"parcel\");\n    const milestones = MILESTONES.map((m, i) => {\n      const done = i <= S.milestone;\n      return {\n        label: m[1],\n        when: i === 0 ? \"Jul 31\" : i === 1 && done ? \"Aug 1\" : i === 2 && done ? \"Aug 8\" : i === 3 && done ? \"Aug 11\" : \"\",\n        done,\n        border: done ? \"var(--cz-action-fill)\" : \"var(--cz-hair-strong)\",\n        fill: done ? \"var(--cz-action-fill)\" : \"transparent\",\n        ink: done ? \"var(--cz-ink)\" : \"var(--cz-faint)\",\n        bg: i === S.milestone ? \"var(--cz-accent-bg)\" : \"transparent\",\n        onPick: () => this.setState({ milestone: i })\n      };\n    });\n\n    const fitRows = inParcel.map(i => ({\n      title: i.title, tile: i.tile, sizeLine: i.size + \" · \" + i.order,\n      options: [\"tight\", \"right\", \"roomy\"].map(o => ({\n        label: o, active: S.fit[i.id] === o,\n        onPick: () => this.setState(s => ({ fit: { ...s.fit, [i.id]: s.fit[i.id] === o ? null : o } }))\n      }))\n    }));\n\n    return {\n      ten: 10,\n      empty: \"\",\n      noop: () => {},\n      tab: \"hauls\",\n      tabOptions: [{ value: \"shelf\", label: \"Shelf\" }, { value: \"hauls\", label: \"Hauls · 4\" }],\n      navLinks: [{ label: \"How it works\", href: \"#\" }, { label: \"Guides\", href: \"#\" }, { label: \"Pricing\", href: \"#\" }, { label: \"Support\", href: \"#\" }],\n      stop: e => e.stopPropagation(),\n\n      isIndex: S.screen === \"index\",\n      isBoard: S.screen === \"board\",\n      isShip: S.screen === \"ship\",\n      isTracking: S.screen === \"tracking\",\n      goIndex: e => { e.preventDefault(); this.go(\"index\"); },\n      goBoard: e => { if (e && e.preventDefault) e.preventDefault(); this.go(\"board\"); },\n      goShip: () => inParcel.length ? this.go(\"ship\") : this.say(\"Add something to parcel A first\"),\n\n      hauls,\n      needsYouMeta: (pendingQC ? 2 : 1) + \" need you\",\n      gridMeta: \"4 hauls · \" + this.m(goodsAll + 118.20 + 128.60 + 57.80) + \" of goods in flight\",\n\n      goodsTotal: this.m(items.reduce((a, i) => a + i.price, 0)),\n      columns,\n      parcelItems: inParcel.map(mk),\n      parcelCount: inParcel.length,\n      parcelEmpty: inParcel.length === 0,\n      actualLabel: inParcel.length ? this.g(actualG) : \"—\",\n      volLabel: inParcel.length ? this.g(volG) : \"—\",\n      chargeableLabel: inParcel.length ? this.g(chargeableG) : \"—\",\n      billedLabel: inParcel.length ? billedKg.toFixed(1) + \" kg\" : \"—\",\n      divisor: S.divisor,\n      div5000: S.divisor === 5000,\n      div6000: S.divisor === 6000,\n      setDiv5000: () => this.setState({ divisor: 5000 }),\n      setDiv6000: () => this.setState({ divisor: 6000 }),\n      tips, lines: lineRows, shipRange, storageLine,\n      shipCtaLabel: inParcel.length ? \"Review & hand off · \" + inParcel.length : \"Nothing in the box yet\",\n\n      shipItems: inParcel.map(i => ({\n        title: i.title, tile: i.tile, sub: i.size + \" · \" + i.order,\n        weight: this.g(i.actual || i.est), price: this.m(i.price)\n      })),\n      leftBehind: items.filter(i => i.stage !== \"parcel\" && (i.stage === \"qcd\" || i.stage === \"warehouse\")).map(i => {\n        if (i.qc === \"red\") return {\n          title: i.title, tile: i.tile, opacity: 0.62,\n          sub: \"red-lit · \" + (i.reason || \"flagged\"),\n          ink: \"var(--cz-error-text)\", actLabel: null, staticLabel: \"can't ship\"\n        };\n        if (i.qc === \"green\") return {\n          title: i.title, tile: i.tile, opacity: 1,\n          sub: \"green-lit · \" + this.g(i.actual || i.est) + (headroomG >= (i.actual || i.est) ? \" · fits in your headroom\" : \"\"),\n          ink: \"var(--cz-money)\", staticLabel: null,\n          actLabel: \"Add to the box\",\n          onAct: () => { this.patch(i.id, { stage: \"parcel\" }); this.say(\"Added to parcel A\"); }\n        };\n        return {\n          title: i.title, tile: i.tile, opacity: 0.62,\n          sub: \"not reviewed yet · \" + i.photos + \" photos\",\n          ink: \"var(--cz-faint)\", actLabel: null, staticLabel: \"stays behind\"\n        };\n      }),\n      handoffText,\n      copyHandoff: () => this.copy(handoffText, \"Instruction copied\"),\n      chosenLine: S.line,\n      chosenCost: inParcel.length ? this.m(chosenCostN) : \"—\",\n      boxGoods: this.m(boxGoodsN),\n      landedTotal: this.m(boxGoodsN + 18.40 + chosenCostN),\n      declared: S.declared,\n      onDeclared: e => this.setState({ declared: parseFloat(e.target.value) || 0 }),\n      declaredWarning: S.declared > 45\n        ? \"Over $45.00 your country usually charges duty on arrival. Your call, your risk — Credenza does not advise on this.\"\n        : \"Under the $45.00 threshold your country usually charges duty at. Your call, your risk — Credenza does not advise on this.\",\n      submitParcel: () => { this.setState({ milestone: 0, submitted: true }); this.go(\"tracking\"); this.say(\"Parcel A marked submitted\"); },\n\n      milestones,\n      trackMeta: inParcel.length + \" ITEMS · \" + (inParcel.length ? billedKg.toFixed(1) : \"0\") + \" KG · \" + S.line.toUpperCase(),\n      tracking: S.tracking,\n      onTracking: e => this.setState({ tracking: e.target.value }),\n      isReceived: S.milestone >= 3,\n      fitRows,\n      landedNote: S.milestone >= 3 ? \"This is the number to quote when someone asks what the haul cost.\" : \"Final once it clears customs — duty is not in here.\",\n      remainingNote: remaining.length\n        ? (remaining.length === 1 ? \"1 item stays behind\" : remaining.length + \" items stay behind\") + (oldest ? \", oldest has \" + oldest.storage + \" days of free storage left\" : \"\") + \". They can go in parcel B.\"\n        : \"Nothing left. This haul is done.\",\n      onWeight: e => this.state.detailId && this.patch(this.state.detailId, { actual: parseInt(e.target.value, 10) || 0 }),\n      onOrderNo: e => this.state.detailId && this.patch(this.state.detailId, { order: e.target.value }),\n      closeDetail: () => this.setState({ detailId: null }),\n      detail, qc,\n      toast: S.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
