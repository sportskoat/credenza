document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c965346b-9e22-48a3-8a65-ec516c15785e\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet><style>/* Clash Grotesk Variable — the sans half of the Credenza logo.\n   Shipped in the repo at preview/public/fonts/. Licence: assets/fonts/ClashGrotesk-LICENSE.txt\n   The display serif is Georgia (system), by design: the logo's C is a traced\n   Instrument Serif outline, and body serif falls back to Georgia everywhere. */\n@font-face {\n  font-family: \"Clash Grotesk\";\n  src: url(\"0ecab658-f834-482a-aa17-3c37c5a07470\") format(\"woff2-variations\");\n  font-weight: 200 700;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* ── Credenza colour ────────────────────────────────────────────────────────\n   Two colourways, both near-monochrome on purpose: the chrome is grey so the\n   product photography owns the colour story. Money green and heart red are\n   the only hues in the system; album-link blue is the ONE blue allowed on a\n   card. Brand-mark colours are identical in both themes — a mark that\n   re-tints per colourway is not a mark.\n\n   :root      = Gallery (light) — warm-white #F4F4F0 canvas, white cards\n   [data-theme=\"dark\"] = Blackout — true black #000000, neutral #202024 cards\n   ────────────────────────────────────────────────────────────────────────── */\n:root {\n  /* Surfaces */\n  --cz-bg: #F4F4F0;\n  --cz-bg-elevated: #ffffff;\n  --cz-card: rgba(255, 255, 255, 0.85);\n  --cz-card-solid: #ffffff;\n  --cz-chip-fill: #E6E6DE;\n  --cz-strip-bg: #EAEAE4;\n  --cz-footer-bg: #EFEFE9;\n  --cz-inset-bg: #FAFAF6;\n  --cz-seg: rgba(23, 24, 26, 0.06);\n\n  /* Lines */\n  --cz-hair: #d2d2c9;\n  --cz-hair-strong: rgba(23, 24, 26, 0.18);\n\n  /* Ink ramp */\n  --cz-ink: #17181a;\n  --cz-sub: #4f545b;\n  --cz-faint: #6b7078;\n  --cz-placeholder: #8a9099;\n\n  /* Brand mark — fixed in both themes */\n  --cz-brand-ground: #0f1114;\n  --cz-brand-c: #e9edf2;\n  --cz-brand-rule: #4da3ff;\n\n  /* Action / accent (accent IS ink; the chrome is monochrome) */\n  --cz-accent: #17181a;\n  --cz-accent-bg: rgba(23, 24, 26, 0.08);\n  --cz-accent-deep: #3c3e44;\n  --cz-accent-tint: rgba(20, 122, 58, 0.06);\n  --cz-action-fill: #17181a;\n  --cz-action-text: #F4F4F0;\n  --cz-action-text-divider: rgba(244, 244, 240, 0.22);\n  --cz-action-muted-bg: rgba(23, 24, 26, 0.92);\n  --cz-action-muted-text: #F4F4F0;\n  --cz-focus: #17181a;\n  --cz-favorite: #17181a;\n\n  /* Semantic hues — the only colour in the chrome */\n  --cz-money: #147a3a;\n  --cz-money-bg: rgba(21, 128, 61, 0.09);\n  --cz-money-on-photo: #7ee2a8;\n  --cz-money-bright: #5fd28f;\n  --cz-like: #e11d48;\n  --cz-link: #1d5fd0;\n  --cz-link-on-photo: #cfe0ff;\n  --cz-warn: #C0932a;\n  --cz-warn-ink: #8a6714;\n  --cz-error-bg: rgba(225, 29, 72, 0.10);\n  --cz-error-text: #be123c;\n\n  /* Order-status track tints (bg + text pairs, each ≥ 4.5:1) */\n  --cz-status-bought-bg: oklch(0.93 0.045 250);\n  --cz-status-bought-text: oklch(0.42 0.13 250);\n  --cz-status-shipped-bg: oklch(0.93 0.045 290);\n  --cz-status-shipped-text: oklch(0.42 0.13 290);\n  --cz-status-qc-bg: oklch(0.94 0.06 85);\n  --cz-status-qc-text: oklch(0.45 0.13 70);\n\n  /* Marketplace tile colours (photo fallbacks) */\n  --cz-tile-weidian: rgb(255, 90, 60);\n  --cz-tile-yupoo: rgb(55, 178, 77);\n  --cz-tile-taobao: rgb(255, 80, 0);\n\n  /* Selection + glow */\n  --cz-selection: rgba(23, 24, 26, 0.16);\n  --cz-selection-text: #17181a;\n  --cz-glow: rgba(23, 24, 26, 0.14);\n  --cz-glow-weak: rgba(244, 244, 240, 0.55);\n\n  /* Gradient ramp (Buy sheen, ambient) */\n  --cz-gradient-1: #17181a;\n  --cz-gradient-2: #565a61;\n  --cz-gradient-3: #656a72;\n}\n\n[data-theme=\"dark\"] {\n  --cz-bg: #000000;\n  --cz-bg-elevated: #101012;\n  --cz-card: rgba(32, 32, 36, 0.86);\n  --cz-card-solid: #202024;\n  --cz-chip-fill: rgba(255, 255, 255, 0.10);\n  --cz-strip-bg: #151517;\n  --cz-footer-bg: #0c0c0e;\n  --cz-inset-bg: #26262b;\n  --cz-seg: rgba(255, 255, 255, 0.07);\n\n  --cz-hair: rgba(255, 255, 255, 0.16);\n  --cz-hair-strong: rgba(255, 255, 255, 0.24);\n\n  --cz-ink: #f5f5f7;\n  --cz-sub: #b7bbc2;\n  --cz-faint: #9ea3ab;\n  --cz-placeholder: #8a9099;\n\n  --cz-brand-ground: #0f1114;\n  --cz-brand-c: #e9edf2;\n  --cz-brand-rule: #4da3ff;\n\n  --cz-accent: #f5f5f7;\n  --cz-accent-bg: rgba(245, 245, 247, 0.12);\n  --cz-accent-deep: #ffffff;\n  --cz-accent-tint: rgba(74, 222, 128, 0.10);\n  --cz-action-fill: #f5f5f7;\n  --cz-action-text: #000000;\n  --cz-action-text-divider: rgba(0, 0, 0, 0.18);\n  --cz-action-muted-bg: rgba(245, 245, 247, 0.92);\n  --cz-action-muted-text: #1a1a1d;\n  --cz-focus: #f5f5f7;\n  --cz-favorite: #f5f5f7;\n\n  --cz-money: #4ade80;\n  --cz-money-bg: rgba(74, 222, 128, 0.12);\n  --cz-money-on-photo: #137a3a;\n  --cz-money-bright: #86efac;\n  --cz-like: #f40051;\n  --cz-link: #7fb2ff;\n  --cz-link-on-photo: #cfe0ff;\n  --cz-warn: #d9a83c;\n  --cz-warn-ink: #e8bf63;\n  --cz-error-bg: rgba(244, 63, 94, 0.16);\n  --cz-error-text: #f08a92;\n\n  --cz-status-bought-bg: oklch(0.30 0.06 250);\n  --cz-status-bought-text: oklch(0.84 0.10 250);\n  --cz-status-shipped-bg: oklch(0.30 0.06 290);\n  --cz-status-shipped-text: oklch(0.84 0.10 290);\n  --cz-status-qc-bg: oklch(0.32 0.07 85);\n  --cz-status-qc-text: oklch(0.86 0.11 85);\n\n  --cz-selection: rgba(245, 245, 247, 0.22);\n  --cz-selection-text: #f5f5f7;\n  --cz-glow: rgba(245, 245, 247, 0.30);\n  --cz-glow-weak: rgba(26, 26, 29, 0.55);\n\n  --cz-gradient-1: #1a1a1d;\n  --cz-gradient-2: #3a3a40;\n  --cz-gradient-3: #a3a3ab;\n}\n<\u002Fstyle>\n<style>/* Type tokens. TWO families now, plus mono.\n\n   2026-07-28: the display serif was retired. Georgia's wide, even strokes read\n   as heavy above ~24px — the \"fat\" problem — and its only job was to stand in\n   for a serif the product never actually shipped. Display is now Clash Grotesk\n   at 600 tracked hard to −0.035em; body is the same family at 500/600 tracked\n   −0.01em. One face, two voices, separated by weight and tracking rather than\n   by family.\n\n   Consequence to respect: the wordmark is ALSO Clash. A page heading and the\n   logo are now the same letterforms, so never set a heading at the wordmark's\n   0.16em tracking — the tracking is what keeps them distinct. */\n:root {\n  --cz-display: \"Clash Grotesk\", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; /* @kind font */\n  --cz-sans: \"Clash Grotesk\", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; /* @kind font */\n  --cz-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace; /* @kind font */\n\n  /* Semantic roles */\n  --font-display: var(--cz-display); /* headings, card titles, prices, big numbers */\n  --font-body: var(--cz-sans);       /* body copy, labels, controls */\n  --font-data: var(--cz-mono);       /* IDs, sizes, weights, kickers, status */\n\n  /* Marketing display scale (fluid, serif) */\n  --type-hero: clamp(34px, 5vw, 58px);\n  --type-h2: clamp(26px, 3.4vw, 38px);\n  --type-h3: clamp(24px, 3vw, 32px);\n  --type-lede: clamp(15.5px, 1.3vw, 17.5px);\n\n  /* App scale (fixed px — the shelf is a dense tool, not a page) */\n  --type-hero-app: 37px;      /* empty-shelf hero on phone */\n  --type-title-card: 17px;    /* grid card title, serif */\n  --type-title-dense: 16px;   /* two-line card variant */\n  --type-body: 14px;\n  --type-body-sm: 13px;       /* pills, tabs, most chrome */\n  --type-meta: 12px;          /* captions, totals, field labels */\n  --type-micro: 11px;         /* chips, seller line */\n  --type-kicker: 11px;        /* mono, uppercase, tracked */\n  --type-flag: 10px;          /* status pill */\n\n  /* Weights actually used in the product */\n  --weight-regular: 500; /* @kind other */\n  --weight-medium: 600; /* @kind other */\n  --weight-semibold: 650; /* @kind other */\n  --weight-bold: 700; /* @kind other */\n  --weight-heavy: 750; /* @kind other */\n  --weight-flag: 800; /* @kind other */         /* status pill + wordmark */\n\n  /* Tracking. Display runs TIGHT — a grotesk needs it to read as display. */\n  --track-hero: -0.038em; /* @kind other */\n  --track-display: -0.035em; /* @kind other */\n  --track-title: -0.03em; /* @kind other */\n  --track-tight: -0.01em; /* @kind other */\n  --track-kicker: 0.14em; /* @kind other */\n  --track-flag: 0.08em; /* @kind other */\n  --track-wordmark: 0.16em; /* @kind other */\n  --track-wordmark-kicker: 0.30em; /* @kind other */\n\n  /* Leading */\n  --leading-hero: 1.06; /* @kind other */\n  --leading-title: 1.25; /* @kind other */\n  --leading-body: 1.5; /* @kind other */\n  --leading-lede: 1.6; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Spacing, radii and the touch floors. Values are lifted verbatim from the\n   product — Credenza does not sit on a 4/8px grid, and rounding these is a\n   defect (10px card gaps, 13px card text padding, 42px Buy, 52px hero field). */\n:root {\n  /* Space scale actually in use */\n  --space-1: 4px;\n  --space-2: 6px;\n  --space-3: 8px;\n  --space-4: 10px;   /* shelf grid gap */\n  --space-5: 12px;\n  --space-6: 14px;   /* card body inline padding */\n  --space-7: 16px;\n  --space-8: 18px;   /* view-tab gap */\n  --space-9: 22px;\n  --space-10: 28px;\n  --space-12: 48px;\n\n  /* Shell + container */\n  --shell-max: 1080px;      /* app: one container for the whole shelf */\n  --site-max: 1120px;       /* marketing site */\n  --shell-pad-desktop: 28px;\n  --shell-pad-tablet: 22px;\n  --shell-pad-phone: 16px;\n  --shell-pad-small: 14px;\n  --site-pad-x: clamp(24px, 6.5vw, 48px);\n\n  /* Radii */\n  --radius-pill: 999px;      /* every pill, chip, status flag, heart */\n  --radius-field: 10px;      /* form input */\n  --radius-row: 11px;        /* fact rows */\n  --radius-card-tight: 14px; /* two-line grid card, paste field, marketing card */\n  --radius-card: 16px;       /* editorial grid card, primary CTA */\n  --radius-sheet: 18px;      /* phone bottom sheet top corners */\n  --radius-panel: 20px;      /* empty states */\n  --radius-frame: 22px;      /* marketing demo frame */\n  --radius-mark: 31%;        /* brand mark ground: 12.4 on a 40 box */\n\n  /* Touch floors — non-negotiable */\n  --tap-min: 44px;           /* coarse pointer */\n  --control-h: 40px;         /* fine pointer pill / icon button */\n  --buy-h: 42px;\n  --field-h: 52px;           /* hero search + stash */\n  --cta-h: 54px;             /* marketing primary/secondary */\n\n  /* Grid */\n  --shelf-gap: 10px;\n  --shelf-cols-phone: 2; /* @kind other */\n  --shelf-cols-tablet: 3; /* @kind other */\n  --shelf-cols-desktop: 4; /* @kind other */\n  --card-aspect: 4 / 5; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* One easing curve for everything. Four durations. Nothing bounces. */\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); /* @kind other */\n  --ease-fade: cubic-bezier(0.22, 0.9, 0.3, 1); /* @kind other */\n\n  --dur-press: 120ms; /* @kind other */   /* :active scale */\n  --dur-micro: 140ms; /* @kind other */   /* colour, opacity, hover */\n  --dur-open: 250ms; /* @kind other */    /* sheets, overlays */\n  --dur-resize: 300ms; /* @kind other */  /* height/accordion */\n\n  /* Press scale — the whole system uses two values, nothing else */\n  --press-scale: 0.96; /* @kind other */      /* pills, chips, tabs, icon buttons */\n  --press-scale-large: 0.98; /* @kind other */ /* full-width rows and Buy */\n  --hover-lift: -2px; /* @kind other */        /* cards and action rows only */\n}\n<\u002Fstyle>\n<style>/* Elevation. Gallery light keeps shadows nearly flat — on the warm canvas a\n   real drop shadow reads as grey grime, so the hairline does the separating.\n   Blackout goes deeper because a light shadow is invisible on true black. */\n:root {\n  --shadow-hairline: 0 1px 2px rgba(23, 24, 26, 0.06);      /* fields on Gallery */\n  --shadow-card: 0 6px 16px rgba(23, 24, 26, 0.06);          /* grid card at rest */\n  --shadow-card-dense: 0 1px 2px oklch(0 0 0 / 0.09), 0 8px 20px oklch(0 0 0 / 0.07);\n  --shadow-card-hover: 0 0 0 1px color-mix(in srgb, var(--cz-ink) 12%, transparent), 0 16px 36px rgba(23, 24, 26, 0.12);\n  --shadow-flag: 0 2px 8px rgba(0, 0, 0, 0.25);              /* status pill over photo */\n  --shadow-chip: 0 2px 8px rgba(23, 24, 26, 0.16);           /* price chip over photo */\n  --shadow-toast: 0 10px 28px oklch(0 0 0 / 0.12), 0 2px 7px oklch(0 0 0 / 0.08);\n  --shadow-modal: 0 24px 64px oklch(0 0 0 / 0.24), 0 4px 14px oklch(0 0 0 / 0.12);\n  --shadow-fab: 0 10px 26px rgba(23, 24, 26, 0.34);\n\n  /* Focus ring — one recipe everywhere */\n  --focus-ring: 2px solid var(--cz-focus); /* @kind other */\n  --focus-offset: 2px; /* @kind other */\n\n  /* Blur: only two places use it — the modal backdrop and chips over photos */\n  --blur-backdrop: blur(6px); /* @kind other */\n  --blur-overlay: blur(14px); /* @kind other */\n  --blur-chip: blur(10px); /* @kind other */\n}\n\n[data-theme=\"dark\"] {\n  --shadow-hairline: 0 1px 3px rgba(0, 0, 0, 0.14);\n  --shadow-card: 0 6px 16px rgba(0, 0, 0, 0.4);\n  --shadow-card-dense: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.35);\n  --shadow-fab: 0 10px 30px rgba(0, 0, 0, 0.62);\n}\n<\u002Fstyle>\n<style>/* Clash Grotesk Variable — the sans half of the Credenza logo.\n   Shipped in the repo at preview/public/fonts/. Licence: assets/fonts/ClashGrotesk-LICENSE.txt\n   The display serif is Georgia (system), by design: the logo's C is a traced\n   Instrument Serif outline, and body serif falls back to Georgia everywhere. */\n@font-face {\n  font-family: \"Clash Grotesk\";\n  src: url(\"0ecab658-f834-482a-aa17-3c37c5a07470\") format(\"woff2-variations\");\n  font-weight: 200 700;\n  font-display: swap;\n}\n\n/* ── Credenza colour ────────────────────────────────────────────────────────\n   Two colourways, both near-monochrome on purpose: the chrome is grey so the\n   product photography owns the colour story. Money green and heart red are\n   the only hues in the system; album-link blue is the ONE blue allowed on a\n   card. Brand-mark colours are identical in both themes — a mark that\n   re-tints per colourway is not a mark.\n\n   :root      = Gallery (light) — warm-white #F4F4F0 canvas, white cards\n   [data-theme=\"dark\"] = Blackout — true black #000000, neutral #202024 cards\n   ────────────────────────────────────────────────────────────────────────── */\n:root {\n  /* Surfaces */\n  --cz-bg: #F4F4F0;\n  --cz-bg-elevated: #ffffff;\n  --cz-card: rgba(255, 255, 255, 0.85);\n  --cz-card-solid: #ffffff;\n  --cz-chip-fill: #E6E6DE;\n  --cz-strip-bg: #EAEAE4;\n  --cz-footer-bg: #EFEFE9;\n  --cz-inset-bg: #FAFAF6;\n  --cz-seg: rgba(23, 24, 26, 0.06);\n\n  /* Lines */\n  --cz-hair: #d2d2c9;\n  --cz-hair-strong: rgba(23, 24, 26, 0.18);\n\n  /* Ink ramp */\n  --cz-ink: #17181a;\n  --cz-sub: #4f545b;\n  --cz-faint: #6b7078;\n  --cz-placeholder: #8a9099;\n\n  /* Brand mark — fixed in both themes */\n  --cz-brand-ground: #0f1114;\n  --cz-brand-c: #e9edf2;\n  --cz-brand-rule: #4da3ff;\n\n  /* Action / accent (accent IS ink; the chrome is monochrome) */\n  --cz-accent: #17181a;\n  --cz-accent-bg: rgba(23, 24, 26, 0.08);\n  --cz-accent-deep: #3c3e44;\n  --cz-accent-tint: rgba(20, 122, 58, 0.06);\n  --cz-action-fill: #17181a;\n  --cz-action-text: #F4F4F0;\n  --cz-action-text-divider: rgba(244, 244, 240, 0.22);\n  --cz-action-muted-bg: rgba(23, 24, 26, 0.92);\n  --cz-action-muted-text: #F4F4F0;\n  --cz-focus: #17181a;\n  --cz-favorite: #17181a;\n\n  /* Semantic hues — the only colour in the chrome */\n  --cz-money: #147a3a;\n  --cz-money-bg: rgba(21, 128, 61, 0.09);\n  --cz-money-on-photo: #7ee2a8;\n  --cz-money-bright: #5fd28f;\n  --cz-like: #e11d48;\n  --cz-link: #1d5fd0;\n  --cz-link-on-photo: #cfe0ff;\n  --cz-warn: #C0932a;\n  --cz-warn-ink: #8a6714;\n  --cz-error-bg: rgba(225, 29, 72, 0.10);\n  --cz-error-text: #be123c;\n\n  /* Order-status track tints (bg + text pairs, each ≥ 4.5:1) */\n  --cz-status-bought-bg: oklch(0.93 0.045 250);\n  --cz-status-bought-text: oklch(0.42 0.13 250);\n  --cz-status-shipped-bg: oklch(0.93 0.045 290);\n  --cz-status-shipped-text: oklch(0.42 0.13 290);\n  --cz-status-qc-bg: oklch(0.94 0.06 85);\n  --cz-status-qc-text: oklch(0.45 0.13 70);\n\n  /* Marketplace tile colours (photo fallbacks) */\n  --cz-tile-weidian: rgb(255, 90, 60);\n  --cz-tile-yupoo: rgb(55, 178, 77);\n  --cz-tile-taobao: rgb(255, 80, 0);\n\n  /* Selection + glow */\n  --cz-selection: rgba(23, 24, 26, 0.16);\n  --cz-selection-text: #17181a;\n  --cz-glow: rgba(23, 24, 26, 0.14);\n  --cz-glow-weak: rgba(244, 244, 240, 0.55);\n\n  /* Gradient ramp (Buy sheen, ambient) */\n  --cz-gradient-1: #17181a;\n  --cz-gradient-2: #565a61;\n  --cz-gradient-3: #656a72;\n}\n\n[data-theme=\"dark\"] {\n  --cz-bg: #000000;\n  --cz-bg-elevated: #101012;\n  --cz-card: rgba(32, 32, 36, 0.86);\n  --cz-card-solid: #202024;\n  --cz-chip-fill: rgba(255, 255, 255, 0.10);\n  --cz-strip-bg: #151517;\n  --cz-footer-bg: #0c0c0e;\n  --cz-inset-bg: #26262b;\n  --cz-seg: rgba(255, 255, 255, 0.07);\n\n  --cz-hair: rgba(255, 255, 255, 0.16);\n  --cz-hair-strong: rgba(255, 255, 255, 0.24);\n\n  --cz-ink: #f5f5f7;\n  --cz-sub: #b7bbc2;\n  --cz-faint: #9ea3ab;\n  --cz-placeholder: #8a9099;\n\n  --cz-brand-ground: #0f1114;\n  --cz-brand-c: #e9edf2;\n  --cz-brand-rule: #4da3ff;\n\n  --cz-accent: #f5f5f7;\n  --cz-accent-bg: rgba(245, 245, 247, 0.12);\n  --cz-accent-deep: #ffffff;\n  --cz-accent-tint: rgba(74, 222, 128, 0.10);\n  --cz-action-fill: #f5f5f7;\n  --cz-action-text: #000000;\n  --cz-action-text-divider: rgba(0, 0, 0, 0.18);\n  --cz-action-muted-bg: rgba(245, 245, 247, 0.92);\n  --cz-action-muted-text: #1a1a1d;\n  --cz-focus: #f5f5f7;\n  --cz-favorite: #f5f5f7;\n\n  --cz-money: #4ade80;\n  --cz-money-bg: rgba(74, 222, 128, 0.12);\n  --cz-money-on-photo: #137a3a;\n  --cz-money-bright: #86efac;\n  --cz-like: #f40051;\n -data: var(--cz-mono);       /* IDs, sizes, weights, kickers, status */\n\n  /* Marketing display scale (fluid, serif) */\n  --type-hero: clamp(34px, 5vw, 58px);\n  --type-h2: clamp(26px, 3.4vw, 38px);\n  --type-h3: clamp(24px, 3vw, 32px);\n  --type-lede: clamp(15.5px, 1.3vw, 17.5px);\n\n  /* App scale (fixed px — the shelf is a dense tool, not a page) */\n  --type-hero-app: 37px;      /* empty-shelf hero on phone */\n  --type-title-card: 17px;    /* grid card title, serif */\n  --type-title-dense: 16px;   /* two-line card variant */\n  --type-body: 14px;\n  --type-body-sm: 13px;       /* pills, tabs, most chrome */\n  --type-meta: 12px;          /* captions, totals, field labels */\n  --type-micro: 11px;         /* chips, seller line */\n  --type-kicker: 11px;        /* mono, uppercase, tracked */\n  --type-flag: 10px;          /* status pill */\n\n  /* Weights actually used in the product */\n  --weight-regular: 500; /* @kind other */\n  --weight-medium: 600; /* @kind other */\n  --weight-semibold: 650; /* @kind other */\n  --weight-bold: 700; /* @kind other */\n  --weight-heavy: 750; /* @kind other */\n  --weight-flag: 800; /* @kind other */         /* status pill + wordmark */\n\n  /* Tracking. Display runs TIGHT — a grotesk needs it to read as display. */\n  --track-hero: -0.038em; /* @kind other */\n  --track-display: -0.035em; /* @kind other */\n  --track-title: -0.03em; /* @kind other */\n  --track-tight: -0.01em; /* @kind other */\n  --track-kicker: 0.14em; /* @kind other */\n  --track-flag: 0.08em; /* @kind other */\n  --track-wordmark: 0.16em; /* @kind other */\n  --track-wordmark-kicker: 0.30em; /* @kind other */\n\n  /* Leading */\n  --leading-hero: 1.06; /* @kind other */\n  --leading-title: 1.25; /* @kind other */\n  --leading-body: 1.5; /* @kind other */\n  --leading-lede: 1.6; /* @kind other */\n}\n\n/* Spacing, radii and the touch floors. Values are lifted verbatim from the\n   product — Credenza does not sit on a 4/8px grid, and rounding these is a\n   defect (10px card gaps, 13px card text padding, 42px Buy, 52px hero field). */\n:root {\n  /* Space scale actually in use */\n  --space-1: 4px;\n  --space-2: 6px;\n  --space-3: 8px;\n  --space-4: 10px;   /* shelf grid gap */\n  --space-5: 12px;\n  --space-6: 14px;   /* card body inline padding */\n  --space-7: 16px;\n  --space-8: 18px;   /* view-tab gap */\n  --space-9: 22px;\n  --space-10: 28px;\n  --space-12: 48px;\n\n  /* Shell + container */\n  --shell-max: 1080px;      /* app: one container for the whole shelf */\n  --site-max: 1120px;       /* marketing site */\n  --shell-pad-desktop: 28px;\n  --shell-pad-tablet: 22px;\n  --shell-pad-phone: 16px;\n  --shell-pad-small: 14px;\n  --site-pad-x: clamp(24px, 6.5vw, 48px);\n\n  /* Radii */\n  --radius-pill: 999px;      /* every pill, chip, status flag, heart */\n  --radius-field: 10px;      /* form input */\n  --radius-row: 11px;        /* fact rows */\n  --radius-card-tight: 14px; /* two-line grid card, paste field, marketing card */\n  --radius-card: 16px;       /* editorial grid card, primary CTA */\n  --radius-sheet: 18px;      /* phone bottom sheet top corners */\n  --radius-panel: 20px;      /* empty states */\n  --radius-frame: 22px;      /* marketing demo frame */\n  --radius-mark: 31%;        /* brand mark ground: 12.4 on a 40 box */\n\n  /* Touch floors — non-negotiable */\n  --tap-min: 44px;           /* coarse pointer */\n  --control-h: 40px;         /* fine pointer pill / icon button */\n  --buy-h: 42px;\n  --field-h: 52px;           /* hero search + stash */\n  --cta-h: 54px;             /* marketing primary/secondary */\n\n  /* Grid */\n  --shelf-gap: 10px;\n  --shelf-cols-phone: 2; /* @kind other */\n  --shelf-cols-tablet: 3; /* @kind other */\n  --shelf-cols-desktop: 4; /* @kind other */\n  --card-aspect: 4 / 5; /* @kind other */\n}\n\n/* One easing curve for everything. Four durations. Nothing bounces. */\n:root {\n  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); /* @kind other */\n  --ease-fade: cubic-bezier(0.22, 0.9, 0.3, 1); /* @kind other */\n\n  --dur-press: 120ms; /* @kind other */   /* :active scale */\n  --dur-micro: 140ms; /* @kind other */   /* colour, opacity, hover */\n  --dur-open: 250ms; /* @kind other */    /* sheets, overlays */\n  --dur-resize: 300ms; /* @kind other */  /* height/accordion */\n\n  /* Press scale — the whole system uses two values, nothing else */\n  --press-scale: 0.96; /* @kind other */      /* pills, chips, tabs, icon buttons */\n  --press-scale-large: 0.98; /* @kind other */ /* full-width rows and Buy */\n  --hover-lift: -2px; /* @kind other */        /* cards and action rows only */\n}\n\n/* Elevation. Gallery light keeps shadows nearly flat — on the warm canvas a\n   real drop shadow reads as grey grime, so the hairline does the separating.\n   Blackout goes deeper because a light shadow is invisible on true black. */\n:root {\n  --shadow-hairline: 0 1px 2px rgba(23, 24, 26, 0.06);      /* fields on Gallery */\n  --shadow-card: 0 6px 16px rgba(23, 24, 26, 0.06);          /* grid card at rest */\n  --shadow-card-dense: 0 1px 2px oklch(0 0 0 / 0.09), 0 8px 20px oklch(0 0 0 / 0.07);\n  --shadow-card-hover: 0 0 0 1px color-mix(in srgb, var(--cz-ink) 12%, transparent), 0 16px 36px rgba(23, 24, 26, 0.12);\n  --shadow-flag: 0 2px 8px rgba(0, 0, 0, 0.25);              /* status pill over photo */\n  --shadow-chip: 0 2px 8px rgba(23, 24, 26, 0.16);           /* price chip over photo */\n  --shadow-toast: 0 10px 28px oklch(0 0 0 / 0.12), 0 2px 7px oklch(0 0 0 / 0.08);\n  --shadow-modal: 0 24px 64px oklch(0 0 0 / 0.24), 0 4px 14px oklch(0 0 0 / 0.12);\n  --shadow-fab: 0 10px 26px rgba(23, 24, 26, 0.34);\n\n  /* Focus ring — one recipe everywhere */\n  --focus-ring: 2px solid var(--cz-focus); /* @kind other */\n  --focus-offset: 2px; /* @kind other */\n\n  /* Blur: only two places use it — the modal backdrop and chips over photos */\n  --blur-backdrop: blur(6px); /* @kind other */\n  --blur-overlay: blur(14px); /* @kind other */\n  --blur-chip: blur(10px); /* @kind other */\n}\n\n[data-theme=\"dark\"] {\n  --shadow-hairline: 0 1px 3px rgba(0, 0, 0, 0.14);\n  --shadow-card: 0 6px 16px rgba(0, 0, 0, 0.4);\n  --shadow-card-dense: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.35);\n  --shadow-fab: 0 10px 30px rgba(0, 0, 0, 0.62);\n}\n\n<\u002Fstyle>\n<script src=\"e6d79299-4174-4690-b755-80aa4f559c37\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:#000;color:#f5f5f7}\n*{box-sizing:border-box}\n::selection{background:rgba(245,245,247,.22)}\na{color:#7fb2ff;text-decoration:none}\na:hover{color:#a8caff}\ninput{font:inherit}\ninput:focus-visible,button:focus-visible,[role=\"button\"]:focus-visible{outline:2px solid #f5f5f7;outline-offset:2px}\n@keyframes czdrift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(2%,-2%,0)}100%{transform:translate3d(0,0,0)}}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}\n<\u002Fstyle><\u002Fhelmet>\n\n<div data-theme=\"dark\" style=\"position:relative;min-height:100vh;background:var(--cz-bg);font-family:var(--cz-sans);color:var(--cz-ink);-webkit-font-smoothing:antialiased\">\n\n<div aria-hidden=\"true\" style=\"position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(46% 38% at 14% 10%,#1a1a1d 0%,transparent 70%),radial-gradient(40% 34% at 88% 24%,#161619 0%,transparent 72%),radial-gradient(52% 40% at 62% 96%,#151518 0%,transparent 74%);animation:czdrift 18s ease-in-out infinite\"><\u002Fdiv>\n\n<div style=\"position:relative;z-index:1\">\n<x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Masthead\" hint-size=\"100%,62px\" links=\"{{ navLinks }}\" cta=\"Stash\"><\u002Fx-import>\n\n<sc-if value=\"{{ isIndex }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"max-width:1180px;margin:0 auto;padding:22px 28px 140px\">\n  <div style=\"display:flex;gap:12px;margin-bottom:16px\">\n    <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.SearchField\" hint-size=\"100%,44px\" variant=\"bar\" placeholder=\"Search your shelf\" value=\"{{ empty }}\" on-change=\"{{ noop }}\"><\u002Fx-import>\n    <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Button\" hint-size=\"112px,44px\" variant=\"primary\">+  Stash<\u002Fx-import>\n  <\u002Fdiv>\n  <div style=\"width:fit-content;margin-bottom:28px\">\n    <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.SegmentedControl\" hint-size=\"160px,34px\" label=\"Shelf or hauls\" value=\"{{ tab }}\" options=\"{{ tabOptions }}\"><\u002Fx-import>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:4px\">\n    <h2 style=\"margin:0;font-family:var(--cz-display);font-size:22px;font-weight:600;letter-spacing:-0.035em\">Your hauls<\u002Fh2>\n    <span style=\"font-family:var(--cz-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--cz-faint)\">{{ needsYouMeta }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-size:12.5px;color:var(--cz-sub);margin-bottom:20px\">{{ gridMeta }}<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n    <sc-for list=\"{{ hauls }}\" as=\"h\" hint-placeholder-count=\"4\">\n      <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ h.onOpen }}\" style=\"display:flex;flex-direction:column;gap:10px;border:1px solid {{ h.rowBorder }};border-radius:16px;background:var(--cz-card);backdrop-filter:blur(16px) saturate(125%);-webkit-backdrop-filter:blur(16px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.42);overflow:hidden;cursor:pointer;transition:transform 140ms cubic-bezier(.23,1,.32,1)\" style-hover=\"transform:translateY(-2px)\">\n        <div style=\"position:relative;aspect-ratio:4/5;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--cz-hair)\">\n          <sc-for list=\"{{ h.tiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"background:{{ t }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;padding:28px 13px 12px;background:linear-gradient(to top,rgba(0,0,0,.88),transparent);display:flex;flex-direction:column;gap:3px;pointer-events:none\">\n            <span style=\"font-family:var(--cz-display);font-size:16px;font-weight:600;letter-spacing:-0.03em;color:#fff\">{{ h.name }}<\u002Fspan>\n            <span style=\"font-family:var(--cz-mono);font-size:10px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.72)\">{{ h.countLine }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ h.flag }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--cz-mono);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:{{ h.flagBg }};color:{{ h.flagInk }}\">{{ h.flag }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding:0 13px 13px\">\n          <div style=\"display:flex;gap:2px;height:4px\">\n            <sc-for list=\"{{ h.segs }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"flex:{{ s.flex }};border-radius:999px;background:{{ s.bg }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:7px;min-height:34px\">\n            <span style=\"flex:0 0 auto;width:6px;height:6px;margin-top:5px;border-radius:999px;background:{{ h.dot }}\"><\u002Fspan>\n            <span style=\"flex:1;font-size:12px;line-height:1.35;color:{{ h.noteInk }};text-wrap:pretty\">{{ h.note }}<\u002Fspan>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Button\" hint-size=\"100%,40px\" variant=\"{{ h.ctaVariant }}\" on-click=\"{{ h.onCta }}\">{{ h.cta }}<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:flex;flex-direction:column;gap:9px\">\n      <div style=\"aspect-ratio:4/5;border:1px dashed var(--cz-hair-strong);border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--cz-sans);font-size:22px;font-weight:500;color:var(--cz-faint)\">+<\u002Fdiv>\n      <span style=\"font-size:13px;font-weight:650;padding:0 2px\">Start a haul<\u002Fspan>\n      <span style=\"font-size:11.5px;line-height:1.4;color:var(--cz-faint);padding:0 2px\">Add from any card's ··· menu<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ false }}\">\n<main style=\"max-width:1180px;margin:0 auto;padding:20px 28px 140px\">\n  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n    <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Kicker\" hint-size=\"auto,14px\">9 items · haul<\u002Fx-import>\n    <span style=\"font-family:var(--cz-mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--cz-money)\">{{ goodsTotal }}<\u002Fspan>\n    <span style=\"font-family:var(--cz-mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--cz-faint)\">· ORDERING · DAY 14<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:flex-end;gap:14px;margin-bottom:6px\">\n    <a href=\"#\" sc-camel-on-click=\"{{ goIndex }}\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--cz-sub);flex:0 0 auto\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>All hauls<\u002Fa>\n    <h1 style=\"margin:0;font-family:var(--cz-display);font-size:30px;font-weight:600;letter-spacing:-0.035em;line-height:1.05\">winter<\u002Fh1>\n    <span style=\"flex:1\"><\u002Fspan>\n    <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Button\" hint-size=\"auto,40px\" variant=\"outline\">Share<\u002Fx-import>\n  <\u002Fdiv>\n  <div style=\"font-size:13px;color:var(--cz-sub);margin-bottom:20px\">Every stage below is yours to mark. Credenza never touches your agent.<\u002Fdiv>\n\n  <div style=\"display:flex;align-items:stretch;border:1px solid var(--cz-hair);border-radius:14px;background:var(--cz-card);backdrop-filter:blur(16px) saturate(125%);-webkit-backdrop-filter:blur(16px) saturate(125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.42);overflow:hidden;margin-bottom:22px\">\n    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-right:1px solid var(--cz-hair)\">\n      <span style=\"font-family:var(--cz-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--cz-faint)\">Agent<\u002Fspan>\n      <span style=\"font-size:13.5px;font-weight:650\">Superbuy<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-right:1px solid var(--cz-hair)\">\n      <span style=\"font-family:var(--cz-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--cz-faint)\">Goods<\u002Fspan>\n      <span style=\"font-family:var(--cz-mono);font-size:13.5px;font-weight:700;color:var(--cz-money)\">{{ goodsTotal }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-right:1px solid var(--cz-hair)\">\n      <span style=\"font-family:var(--cz-mono);font-size:9px;font-weight:700;letter-spa ht=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fx-import><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 344px;width:344px;display:flex;flex-direction:column;overflow-y:auto;border-left:1px solid var(--cz-hair)\">\n        <div style=\"display:flex;align-items:flex-start;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--cz-hair)\">\n          <div style=\"flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.Kicker\" hint-size=\"auto,13px\" size=\"{{ ten }}\">{{ qc.counter }}<\u002Fx-import>\n            <span style=\"font-family:var(--cz-display);font-size:17px;font-weight:600;letter-spacing:-0.03em;line-height:1.2\">{{ qc.title }}<\u002Fspan>\n            <span style=\"font-family:var(--cz-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--cz-faint)\">{{ qc.sizeLine }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:0 0 auto;margin:-4px -6px 0 0\"><x-import component-from-global-scope=\"CredenzaFashionDesignSystem_8f0205.IconButton\" hint-size=\"40px,40px\" label=\"Close QC review\" on-click=\"{{ qc.onClose }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fx-import><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;padding:16px 18px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ qc.onGreen }}\" style=\"flex:1;min-height:44px;border:1.5px solid {{ qc.greenBorder }};border-radius:999px;background:{{ qc.greenBg }};color:var(--cz-money);font-family:var(--cz-s
